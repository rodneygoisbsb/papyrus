# ===================================================================
# IDENTIFICAÇÃO DA APLICAÇÃO E SERVIDOR WEB
# ===================================================================
spring.application.name=papyrus-backend
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===================================================================
# CONEXÃO COM O NOVO BANCO: papyrus (Postgres.app - Porta 5432)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/papyrus
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Pool de Conexões HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# CONFIGURAÇÃO DO HIBERNATE / JPA
# ===================================================================
# 'update' cria automaticamente todas as tabelas no banco 'papyrus' que acabou de ser criado
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs limpos no terminal
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.papiro.backend=DEBUG